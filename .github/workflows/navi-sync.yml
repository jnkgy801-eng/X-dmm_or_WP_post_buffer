name: navi-sync

on:
  schedule:
    - cron: "0 20 * * *"   # 毎日 日本時間 5:00
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python navi_sync.py
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          NAVI_SITE_URL: https://adult-navi21.site
          NAVI_API_TOKEN: ${{ secrets.NAVI_API_TOKEN }}
