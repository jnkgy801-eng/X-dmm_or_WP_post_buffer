name: navi-sync（FANZAのNTR作品・女優をサイトへ登録）

on:
  schedule:
    - cron: "0 20 * * *"   # 毎日 日本時間 5:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: '確認のみ（サイトに送らない）'
        required: false
        default: false
        type: boolean

concurrency:
  group: navi-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python navi_ntr.py ${{ inputs.dry_run && '--dry-run' || '' }} --csv actress_stats.csv
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          NAVI_SITE_URL: https://adult-navi21.site
          NAVI_API_TOKEN: ${{ secrets.NAVI_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actress_stats
          path: actress_stats.csv
          retention-days: 7
