name: navi-actress

on:
  schedule:
    - cron: "30 20 * * *"   # 毎日 日本時間 5:30(頻度を下げるなら曜日を指定: "30 20 * * 0" など)
  workflow_dispatch:

concurrency:
  group: navi-actress
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python navi_actress.py --config navi_config_video.json --pages 30 --push --max-push 150 --out actress_stats.csv
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          NAVI_SITE_URL: https://adult-navi21.site
          NAVI_API_TOKEN: ${{ secrets.NAVI_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actress_stats
          path: actress_stats.csv
          retention-days: 7
